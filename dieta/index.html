<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>La mia dieta</title>
<meta name="theme-color" content="#059669" />

<!--
  App "La mia dieta" — singola pagina, mobile-first.
  Fonte dati UNICA: ./dieta.md (letto e parsato a runtime).
  Modifica dieta.md e ricarica: l'app si aggiorna senza toccare questo file.
  Stack: React 18 + Tailwind (Play CDN) + Babel standalone. Nessun build step.
-->

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel 7: JSX runtime "classic" (React.createElement). Babel 8 usa "automatic"
     che emette `import ... from "react/jsx-runtime"` e rompe in uno script classico. -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  /* Nasconde la scrollbar della fascia dei giorni, mantenendo lo scroll orizzontale */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  html { -webkit-text-size-adjust: 100%; }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ------------------------------------------------------------------ */
/* Parser di dieta.md                                                  */
/* ------------------------------------------------------------------ */

const GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];

/**
 * Trasforma il testo Markdown di dieta.md nel modello dati dell'app.
 * Ritorna { days: [...], hydration: [...] }.
 * Tollerante a: spazi/tab extra, righe vuote, marcatori ⚠️, trattino —/–/-.
 */
function parseDieta(md) {
  const lines = md.split(/\r?\n/);
  const days = [];
  const hydration = [];

  let curDay = null;   // giorno corrente
  let curMeal = null;  // pasto corrente
  let curSwap = null;  // ultima voce intercambiabile (per agganciarle le alternative)
  let inHydration = false; // stiamo leggendo i bullet del blocco "Promemoria idratazione"

  // Rimuove il marcatore ⚠️ (nota personale) e spazi ai bordi
  const clean = (s) => s.replace(/⚠️/g, '').replace(/\s+/g, ' ').trim();

  for (const raw of lines) {
    const line = raw.replace(/\t/g, '  '); // tab -> 2 spazi (tolleranza)
    const trimmed = line.trim();

    if (!trimmed) continue;                 // riga vuota
    if (trimmed.startsWith('>')) continue;  // blockquote: ignorato

    // Blocco "Promemoria idratazione" (nell'intro, prima dei giorni)
    if (!/^#{2,3}\s/.test(trimmed) && /Promemoria idratazione/i.test(trimmed)) {
      inHydration = true;
      continue;
    }

    // Titolo giorno: "## <Giorno>" (ma NON "### ...")
    const dayMatch = trimmed.match(/^##\s+(.+)$/);
    if (dayMatch && !trimmed.startsWith('###')) {
      inHydration = false;
      const name = clean(dayMatch[1]);
      if (GIORNI.includes(name)) {
        curDay = { name, meals: [] };
        days.push(curDay);
      } else {
        curDay = null; // es. "## Come è strutturato": non è un giorno
      }
      curMeal = null;
      curSwap = null;
      continue;
    }

    // Titolo pasto: "### <Pasto>"
    const mealMatch = trimmed.match(/^###\s+(.+)$/);
    if (mealMatch) {
      inHydration = false;
      if (curDay) {
        curMeal = { name: clean(mealMatch[1]), items: [] };
        curDay.meals.push(curMeal);
      }
      curSwap = null;
      continue;
    }

    if (trimmed === '---') { inHydration = false; continue; } // separatore

    // Da qui in poi consideriamo solo i bullet "- ..." / "* ..."
    const bullet = line.match(/^(\s*)[-*]\s+(.*)$/);
    if (!bullet) continue;

    const indent = bullet[1].length;
    const content = clean(bullet[2]);
    if (!content) continue;

    // Bullet dei promemoria idratazione (nell'intro, nessun giorno ancora aperto)
    if (inHydration && !curDay) {
      hydration.push(content);
      continue;
    }

    if (!curMeal) continue; // bullet fuori da un pasto (intro): ignorato

    // Bullet indentato (≥2 spazi) = alternativa della voce swap corrente
    if (indent >= 2 && curSwap) {
      curSwap.alternatives.push(content);
      continue;
    }

    // Bullet a livello 0: voce intercambiabile o voce fissa?
    // "**Categoria — proposta:** valore"
    const swap = content.match(/^\*\*\s*(.+?)\s*[—–-]\s*proposta\s*:\s*\*\*\s*(.*)$/i);
    if (swap) {
      curSwap = { kind: 'swap', category: clean(swap[1]), proposal: clean(swap[2]), alternatives: [] };
      curMeal.items.push(curSwap);
    } else {
      curSwap = null;
      curMeal.items.push({ kind: 'fixed', text: content });
    }
  }

  return { days, hydration };
}

/* ------------------------------------------------------------------ */
/* Icone (sottoinsieme di lucide, inline per non caricare librerie)    */
/* ------------------------------------------------------------------ */

const Svg = ({ children, size = 20, className = '' }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
       fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
       strokeLinejoin="round" className={className} aria-hidden="true">{children}</svg>
);

const Icon = {
  Search: (p) => <Svg {...p}><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></Svg>,
  X: (p) => <Svg {...p}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></Svg>,
  Chevron: (p) => <Svg {...p}><path d="m6 9 6 6 6-6" /></Svg>,
  Reset: (p) => <Svg {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Svg>,
  Droplet: (p) => <Svg {...p}><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z" /></Svg>,
  Coffee: (p) => <Svg {...p}><path d="M17 8h1a4 4 0 1 1 0 8h-1" /><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" /><line x1="6" x2="6" y1="2" y2="4" /><line x1="10" x2="10" y1="2" y2="4" /><line x1="14" x2="14" y1="2" y2="4" /></Svg>,
  Apple: (p) => <Svg {...p}><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z" /><path d="M10 2c1 .5 2 2 2 5" /></Svg>,
  Utensils: (p) => <Svg {...p}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7" /></Svg>,
  Moon: (p) => <Svg {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></Svg>,
  Check: (p) => <Svg {...p}><path d="M20 6 9 17l-5-5" /></Svg>,
};

// Associa un'icona a ciascun pasto (in base al nome del titolo ###)
function iconForMeal(name) {
  const n = name.toLowerCase();
  if (n.includes('colazione')) return Icon.Coffee;
  if (n.includes('spuntino')) return Icon.Apple;
  if (n.includes('pranzo')) return Icon.Utensils;
  if (n.includes('cena')) return Icon.Moon;
  return Icon.Utensils;
}

/* ------------------------------------------------------------------ */
/* Evidenziazione delle grammature/quantità                            */
/* ------------------------------------------------------------------ */

// Numeri con eventuale unità (g/ml) o quantità semplici -> evidenziati
const QTY = /(\d+(?:[.,]\d+)?\s?(?:g|ml)\b|\d+(?:[.,]\d+)?)/gi;

function Grammature({ text }) {
  const parts = [];
  let last = 0;
  let m;
  QTY.lastIndex = 0;
  while ((m = QTY.exec(text)) !== null) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    parts.push(
      <span key={m.index} className="font-semibold text-emerald-700 bg-emerald-50 rounded px-1 py-0.5">
        {m[0]}
      </span>
    );
    last = m.index + m[0].length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return <span>{parts}</span>;
}

/* ------------------------------------------------------------------ */
/* Componenti UI                                                       */
/* ------------------------------------------------------------------ */

// Nota idratazione (fissa, uguale tutti i giorni)
function HydrationNote({ items }) {
  if (!items.length) return null;
  return (
    <div className="flex gap-3 rounded-2xl bg-sky-50 border border-sky-100 p-4">
      <Icon.Droplet className="text-sky-600 shrink-0 mt-0.5" />
      <div>
        <p className="text-sm font-semibold text-sky-900 mb-1">Idratazione</p>
        <ul className="space-y-1">
          {items.map((t, i) => (
            <li key={i} className="text-sm text-sky-800 leading-snug">
              <Grammature text={t} />
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

// Selettore dei 7 giorni (fascia scorrevole orizzontale)
function DaySelector({ days, selected, onSelect }) {
  return (
    <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
      {days.map((d, i) => {
        const active = i === selected;
        return (
          <button
            key={d.name}
            onClick={() => onSelect(i)}
            className={
              'shrink-0 rounded-full px-4 py-2 text-sm font-medium transition-colors ' +
              (active
                ? 'bg-emerald-600 text-white shadow-sm'
                : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50')
            }
          >
            {d.name}
          </button>
        );
      })}
    </div>
  );
}

// Voce fissa
function FixedItem({ text }) {
  return (
    <li className="flex items-start gap-2 py-1.5">
      <span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-stone-300" />
      <span className="text-stone-700 leading-snug"><Grammature text={text} /></span>
    </li>
  );
}

// Voce intercambiabile: proposta in evidenza + alternative espandibili
function SwapItem({ item, chosen, onChoose, onReset }) {
  const [open, setOpen] = useState(false);
  const hasAlts = item.alternatives.length > 0;
  const current = chosen != null ? chosen : item.proposal;
  const isCustom = chosen != null && chosen !== item.proposal;

  // Elenco selezionabile: proposta originale + tutte le alternative
  const options = useMemo(() => [item.proposal, ...item.alternatives], [item]);

  return (
    <li className="rounded-2xl border border-stone-200 bg-white overflow-hidden">
      <button
        onClick={() => hasAlts && setOpen((o) => !o)}
        className={'w-full text-left p-3 flex items-start gap-3 ' + (hasAlts ? 'active:bg-stone-50' : 'cursor-default')}
      >
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-0.5">
            <span className="text-[11px] font-semibold uppercase tracking-wide text-emerald-700">
              {item.category}
            </span>
            {isCustom && (
              <span className="text-[10px] font-medium text-amber-700 bg-amber-100 rounded-full px-1.5 py-0.5">
                scelta
              </span>
            )}
          </div>
          <p className="text-stone-800 leading-snug font-medium">
            <Grammature text={current} />
          </p>
          {hasAlts && !open && (
            <p className="text-xs text-stone-400 mt-1">
              {item.alternatives.length} alternativ{item.alternatives.length === 1 ? 'a' : 'e'}
            </p>
          )}
        </div>

        <div className="flex items-center gap-1 shrink-0">
          {isCustom && (
            <span
              role="button"
              tabIndex={0}
              onClick={(e) => { e.stopPropagation(); onReset(); }}
              className="p-1.5 rounded-lg text-stone-400 hover:text-emerald-600 hover:bg-emerald-50"
              title="Torna alla proposta del giorno"
            >
              <Icon.Reset size={16} />
            </span>
          )}
          {hasAlts && (
            <Icon.Chevron
              size={18}
              className={'text-stone-400 transition-transform ' + (open ? 'rotate-180' : '')}
            />
          )}
        </div>
      </button>

      {hasAlts && open && (
        <ul className="border-t border-stone-100 bg-stone-50/60 p-2 space-y-1">
          {options.map((opt, i) => {
            const selected = opt === current;
            const isProposal = i === 0;
            return (
              <li key={i}>
                <button
                  onClick={() => { onChoose(isProposal ? null : opt); setOpen(false); }}
                  className={
                    'w-full text-left rounded-xl px-3 py-2 flex items-center gap-2 transition-colors ' +
                    (selected ? 'bg-emerald-600 text-white' : 'text-stone-700 hover:bg-white')
                  }
                >
                  <span className="flex-1 leading-snug">
                    {selected ? opt : <Grammature text={opt} />}
                    {isProposal && (
                      <span className={'ml-2 text-[10px] uppercase tracking-wide ' + (selected ? 'text-emerald-100' : 'text-stone-400')}>
                        proposta
                      </span>
                    )}
                  </span>
                  {selected && <Icon.Check size={16} className="shrink-0" />}
                </button>
              </li>
            );
          })}
        </ul>
      )}
    </li>
  );
}

// Card di un pasto
function MealCard({ meal, dayIndex, mealIndex, selections, setSelection }) {
  const MealIcon = iconForMeal(meal.name);
  const swaps = meal.items.map((it, idx) => ({ it, idx })).filter((x) => x.it.kind === 'swap');
  const fixed = meal.items.map((it, idx) => ({ it, idx })).filter((x) => x.it.kind === 'fixed');

  return (
    <section className="space-y-3">
      <h3 className="flex items-center gap-2 text-stone-500 font-semibold text-sm uppercase tracking-wide">
        <MealIcon size={18} className="text-emerald-600" />
        {meal.name}
      </h3>

      {/* Voci intercambiabili */}
      {swaps.length > 0 && (
        <ul className="space-y-2">
          {swaps.map(({ it, idx }) => {
            const key = `${dayIndex}-${mealIndex}-${idx}`;
            return (
              <SwapItem
                key={key}
                item={it}
                chosen={selections[key] ?? null}
                onChoose={(v) => setSelection(key, v)}
                onReset={() => setSelection(key, null)}
              />
            );
          })}
        </ul>
      )}

      {/* Voci fisse */}
      {fixed.length > 0 && (
        <ul className="rounded-2xl bg-stone-50 border border-stone-100 px-3 py-1.5">
          {fixed.map(({ it, idx }) => <FixedItem key={idx} text={it.text} />)}
        </ul>
      )}
    </section>
  );
}

// Risultati della ricerca alimento
function SearchResults({ results, query, onGoToDay }) {
  if (!query.trim()) return null;
  if (!results.length) {
    return <p className="text-center text-stone-400 py-10">Nessun risultato per “{query}”.</p>;
  }
  return (
    <div className="space-y-2">
      <p className="text-sm text-stone-500">
        {results.length} risultat{results.length === 1 ? 'o' : 'i'} per “{query}”
      </p>
      <ul className="space-y-2">
        {results.map((r, i) => (
          <li key={i}>
            <button
              onClick={() => onGoToDay(r.dayIndex)}
              className="w-full text-left rounded-2xl border border-stone-200 bg-white p-3 hover:bg-stone-50"
            >
              <div className="flex items-center gap-2 text-xs text-stone-400 mb-1">
                <span className="font-medium text-stone-500">{r.dayName}</span>
                <span>·</span>
                <span>{r.mealName}</span>
                {r.category && (
                  <>
                    <span>·</span>
                    <span className="text-emerald-600 font-medium">{r.category}</span>
                  </>
                )}
                <span className="ml-auto uppercase tracking-wide text-[10px] text-stone-300">{r.role}</span>
              </div>
              <p className="text-stone-700 leading-snug"><Grammature text={r.text} /></p>
            </button>
          </li>
        ))}
      </ul>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */

// Indice JS getDay() (0=Dom … 6=Sab) -> indice nel nostro array (0=Lun … 6=Dom)
function todayIndex() {
  const js = new Date().getDay(); // 0..6, 0 = domenica
  return (js + 6) % 7;
}

function App() {
  const [data, setData] = useState(null);   // { days, hydration }
  const [error, setError] = useState(null);
  const [day, setDay] = useState(todayIndex());
  const [query, setQuery] = useState('');
  const [selections, setSelections] = useState({}); // stato in memoria (niente localStorage)
  const [showHydration, setShowHydration] = useState(false);
  const topRef = useRef(null);

  // Carica e parsa dieta.md a runtime
  useEffect(() => {
    fetch('dieta.md', { cache: 'no-store' })
      .then((r) => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then((md) => {
        const parsed = parseDieta(md);
        if (!parsed.days.length) throw new Error('Nessun giorno trovato in dieta.md');
        setData(parsed);
        setDay((d) => Math.min(d, parsed.days.length - 1));
      })
      .catch((e) => setError(e.message));
  }, []);

  const setSelection = (key, value) => {
    setSelections((prev) => {
      const next = { ...prev };
      if (value == null) delete next[key]; // reset alla proposta
      else next[key] = value;
      return next;
    });
  };

  // Indice piatto per la ricerca (proposte + alternative + voci fisse)
  const searchResults = useMemo(() => {
    if (!data || !query.trim()) return [];
    const q = query.trim().toLowerCase();
    const out = [];
    data.days.forEach((d, di) => {
      d.meals.forEach((m) => {
        m.items.forEach((it) => {
          if (it.kind === 'swap') {
            if (it.proposal.toLowerCase().includes(q))
              out.push({ dayIndex: di, dayName: d.name, mealName: m.name, category: it.category, text: it.proposal, role: 'proposta' });
            it.alternatives.forEach((alt) => {
              if (alt.toLowerCase().includes(q))
                out.push({ dayIndex: di, dayName: d.name, mealName: m.name, category: it.category, text: alt, role: 'alternativa' });
            });
          } else if (it.text.toLowerCase().includes(q)) {
            out.push({ dayIndex: di, dayName: d.name, mealName: m.name, category: null, text: it.text, role: 'fisso' });
          }
        });
      });
    });
    return out;
  }, [data, query]);

  const goToDay = (di) => {
    setDay(di);
    setQuery('');
    if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth' });
  };

  /* ---- Stati di caricamento / errore ---- */
  if (error) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6 text-center">
        <div>
          <p className="text-stone-800 font-semibold mb-1">Impossibile caricare la dieta</p>
          <p className="text-stone-500 text-sm">{error}</p>
          <p className="text-stone-400 text-xs mt-3">Avvia un server locale (vedi README) e verifica che <code>dieta.md</code> sia presente.</p>
        </div>
      </div>
    );
  }
  if (!data) {
    return <div className="min-h-screen flex items-center justify-center text-stone-400">Carico la dieta…</div>;
  }

  const currentDay = data.days[day];

  return (
    <div className="min-h-screen bg-stone-100 text-stone-900">
      <div ref={topRef} />

      {/* Header + fascia giorni (sticky) */}
      <header className="sticky top-0 z-10 bg-stone-100/90 backdrop-blur border-b border-stone-200">
        <div className="max-w-2xl mx-auto px-4 pt-4 pb-3 space-y-3">
          <div className="flex items-center justify-between gap-3">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-stone-900">La mia dieta</h1>
              <p className="text-xs text-stone-500">Piano settimanale · tocca una voce per le alternative</p>
            </div>
            <button
              onClick={() => setShowHydration((s) => !s)}
              className={
                'shrink-0 rounded-full p-2.5 border transition-colors ' +
                (showHydration
                  ? 'bg-sky-600 text-white border-sky-600'
                  : 'bg-white text-sky-600 border-stone-200')
              }
              title="Promemoria idratazione"
            >
              <Icon.Droplet size={18} />
            </button>
          </div>

          {/* Ricerca alimento */}
          <div className="relative">
            <Icon.Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Cerca un alimento (es. tonno)…"
              className="w-full rounded-full bg-white border border-stone-200 pl-10 pr-10 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-400"
            />
            {query && (
              <button
                onClick={() => setQuery('')}
                className="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-stone-400 hover:text-stone-600"
              >
                <Icon.X size={16} />
              </button>
            )}
          </div>

          {!query && (
            <DaySelector days={data.days} selected={day} onSelect={setDay} />
          )}
        </div>
      </header>

      <main className="max-w-2xl mx-auto px-4 py-4 space-y-4">
        {showHydration && <HydrationNote items={data.hydration} />}

        {query ? (
          <SearchResults results={searchResults} query={query} onGoToDay={goToDay} />
        ) : (
          <>
            <h2 className="text-2xl font-bold text-stone-900">{currentDay.name}</h2>
            <div className="space-y-6">
              {currentDay.meals.map((meal, mi) => (
                <MealCard
                  key={mi}
                  meal={meal}
                  dayIndex={day}
                  mealIndex={mi}
                  selections={selections}
                  setSelection={setSelection}
                />
              ))}
            </div>
          </>
        )}

        <p className="text-center text-[11px] text-stone-400 pt-4 pb-8">
          Le scelte si azzerano al ricaricamento della pagina.
        </p>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
